<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400">
  <rect width="980" height="400" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="24" y="28" width="200" height="48" rx="8" fill="#f4f4f5" stroke="#3f3f46"/>
  <text x="124" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18181b">Student and teacher logits</text>

  <rect x="264" y="28" width="170" height="48" rx="8" fill="#e8f1fb" stroke="#1d4e89"/>
  <text x="349" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d4e89">Per-sample z-score</text>

  <rect x="474" y="28" width="180" height="48" rx="8" fill="#e8f1fb" stroke="#1d4e89"/>
  <text x="564" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d4e89">Divide by temperature</text>

  <line x1="224" y1="52" x2="260" y2="52" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="434" y1="52" x2="470" y2="52" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="300" y="120" width="200" height="56" rx="8" fill="#fff6e8" stroke="#b86e00"/>
  <text x="400" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9a5b00">Target class vs the rest</text>
  <text x="400" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a5b00">target-class KL</text>

  <rect x="540" y="120" width="200" height="56" rx="8" fill="#fff6e8" stroke="#b86e00"/>
  <text x="640" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9a5b00">Other classes only</text>
  <text x="640" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a5b00">non-target KL</text>

  <line x1="540" y1="76" x2="400" y2="116" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="588" y1="76" x2="640" y2="116" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="430" y="214" width="230" height="52" rx="8" fill="#fff6e8" stroke="#b86e00"/>
  <text x="545" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a5b00">Soft loss</text>
  <text x="545" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a5b00">alpha TCKD + beta NCKD</text>

  <line x1="400" y1="176" x2="500" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="176" x2="590" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="24" y="312" width="130" height="48" rx="8" fill="#f4f4f5" stroke="#3f3f46"/>
  <text x="89" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18181b">Class label</text>

  <rect x="190" y="312" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#3f3f46"/>
  <text x="270" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18181b">Label smoothing</text>

  <rect x="386" y="312" width="200" height="48" rx="8" fill="#fff6e8" stroke="#b86e00"/>
  <text x="486" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9a5b00">Smoothed cross-entropy</text>

  <line x1="154" y1="336" x2="186" y2="336" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="350" y1="336" x2="382" y2="336" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="680" y="268" width="270" height="70" rx="8" fill="#1d4e89"/>
  <text x="815" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Total loss</text>
  <text x="815" y="316" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#dbeafe">hard loss + kd weight x soft loss</text>

  <line x1="660" y1="240" x2="676" y2="290" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="586" y1="336" x2="676" y2="310" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
